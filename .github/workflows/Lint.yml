name: Code Lint

on: [push, pull_request]

jobs:
  Linters:

    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4
    # Python 3.9 is gone from the runners (the step failed before any check ran)
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint
        pip install cpplint
    - name: Analysing the code with pylint
      run: |
        shopt -s nullglob
        pylint -d F0001 {src,test,tools}/*.py
    - name: Analysing the code with cpplint
      run: |
        shopt -s nullglob
        cpplint --extensions=c,cc,cpp,ino --headers=h,hpp {src,src/locale,test,tools}/*.{h,c,cc,cpp,hpp,ino} examples/*/*.{h,c,cc,cpp,hpp,ino}
