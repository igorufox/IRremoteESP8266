name: rtos

# The `rtos` branch alone, as a firmware would take it: every source of src/ against the platform header of
# espurna-base (the tag below) instead of Arduino.h, by the host GCC and by the ARM GCC (the BK7231N core). A compile
# check: the calls of espurna_base.h are implemented by the firmware that uses the library, nothing is linked.
# (Build.yml builds the Arduino examples of master.)

on:
  push:
    branches: [ rtos ]
  pull_request:
    branches: [ rtos ]
  workflow_dispatch:

env:
  ESPURNA_BASE: "1.0.0"

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: host
            cxx: g++
            flags: ""
          - name: arm968e-s
            cxx: arm-none-eabi-g++
            flags: "-mcpu=arm968e-s -mthumb"
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - name: espurna-base
        uses: actions/checkout@v4
        with:
          repository: igorufox/espurna-base
          ref: ${{ env.ESPURNA_BASE }}
          path: deps/espurna-base

      # ARM GNU Toolchain 14.2.Rel1 from developer.arm.com (the GCC of the BK7231N builds), not Ubuntu's apt: its
      # mirror stalled a job for 20+ minutes
      - name: ARM GCC
        if: matrix.cxx == 'arm-none-eabi-g++'
        run: |
          curl -sSfL -o "$RUNNER_TEMP/arm.tar.xz" \
            "https://developer.arm.com/-/media/Files/downloads/gnu/14.2.rel1/binrel/arm-gnu-toolchain-14.2.rel1-x86_64-arm-none-eabi.tar.xz"
          mkdir -p "$RUNNER_TEMP/arm"
          tar -xJf "$RUNNER_TEMP/arm.tar.xz" -C "$RUNNER_TEMP/arm" --strip-components=1
          echo "$RUNNER_TEMP/arm/bin" >> "$GITHUB_PATH"

      - name: Compile
        run: |
          set -e
          ${{ matrix.cxx }} --version | head -1
          FLAGS="-std=gnu++17 -w -Isrc -Ideps/espurna-base/src ${{ matrix.flags }}"
          mkdir -p out
          for f in src/*.cpp; do
            echo "== $f"
            ${{ matrix.cxx }} $FLAGS -c "$f" -o "out/$(basename "$f").o"
          done
